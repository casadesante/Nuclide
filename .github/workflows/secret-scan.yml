name: Secret scan
on:
  push:
    branches: [main]
  pull_request:
    # The refresh pipelines squash-merge and delete their own bot/* branch seconds after opening the
    # pull request, which leaves a pull_request-triggered run with no ref and a red cross that is
    # not a real failure. Those branches are validated inside the refresh job, and this workflow
    # runs again on the push to main after the merge.
    branches-ignore: ["bot/**"]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
