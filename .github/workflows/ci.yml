name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The refresh pipelines squash-merge and delete their own bot/* branch seconds after opening the
    # pull request, which leaves a pull_request-triggered run with no ref and a red cross that is
    # not a real failure. Those branches are validated inside the refresh job, and this workflow
    # runs again on the push to main after the merge.
    branches-ignore: ["bot/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Freshness gate: fails when critical stale records (approved products over 90 days, open trials
      # over 120, indication pages over 180, past calendar events over 30) exceed FRESHNESS_LIMIT. See /freshness/.
      - name: Freshness SLAs
        run: npx tsx scripts/freshness.ts --check
        env:
          FRESHNESS_LIMIT: 25
      - run: npm run build
