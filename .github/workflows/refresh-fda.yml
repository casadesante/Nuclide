name: Refresh FDA approvals feed

on:
  schedule:
    - cron: "7 6 * * 3"  # Wednesdays 06:07 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fetch-fda.ts
      - run: npm run validate
      - uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          branch: bot/refresh-fda
          title: "Weekly refresh: FDA approvals feed"
          commit-message: "chore: refresh FDA approvals feed (OCE notifications, openFDA drugsfda)"
          body: |
            Automated weekly pull of openFDA `drugsfda`: submissions for corpus products, plus a radiopharmaceutical sweep by established pharmacologic class and by nuclide in the generic name, into `public/fda/recent.json`.
            `/regulatory/` shows items new since the last snapshot and notices that match no product ("not yet in corpus"). Add missing regulatory events to the product records and open new-object issues for the rest.
          labels: automated, pipeline
          delete-branch: false
