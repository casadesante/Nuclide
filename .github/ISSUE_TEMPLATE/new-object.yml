name: New object
description: Propose an isotope, indication, technology, target, agent, trial, company, institution, person, pathway, term, pairing, or idea that is missing.
title: "add: "
labels: [new-object]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [indication, isotope, front, technology, target, agent, company, institution, pathway, term, trial, pairing, roadmap, idea, collection, person, bottleneck, key paper, journal]
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: textarea
    id: tldr
    attributes:
      label: One or two plain-English sentences (the TL;DR)
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters and what it should link to
      description: Isotopes, indications, targets, agents, trials, companies already in Nuclide.
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: At least one URL. Trials should include the NCT id.
    validations:
      required: true
